name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Keep in sync with the dev image's Dockerfile; Dependabot only bumps the actions below.
env:
  TOFU_VERSION: 1.13.1
  TFLINT_VERSION: v0.64.0
  TRIVY_VERSION: v0.75.0
  TERRAFORM_DOCS_VERSION: 0.24.0
  PRE_COMMIT_VERSION: 4.7.0

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
          cache: true

      - name: Install tflint plugins
        run: tflint --init --config=.tflint.hcl
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Install terraform-docs
        run: |
          base="https://github.com/terraform-docs/terraform-docs/releases/download/v${TERRAFORM_DOCS_VERSION}"
          file="terraform-docs-v${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$file"
          curl -fsSL "$base/terraform-docs-v${TERRAFORM_DOCS_VERSION}.sha256sum" | grep " ${file}\$" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$file" -C "$HOME/.local/bin" terraform-docs
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: pip install "pre-commit==${PRE_COMMIT_VERSION}"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # A stale README (terraform-docs) or unformatted file fails here and shows the diff.
      - run: pre-commit run --all-files --show-diff-on-failure

  # Checks the version promises in README.md: OpenTofu >= 1.6, Terraform >= 1.3, google >= 5.41.
  validate:
    name: validate (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tofu-min
            cli: tofu
            version: 1.6.3
            google: 5.41.0
            dirs: . examples/basic
          - name: tofu-latest
            cli: tofu
            version: latest
            dirs: . examples/basic
          # examples/basic requires >= 1.6, so Terraform 1.3 only checks the root module.
          - name: terraform-min
            cli: terraform
            version: 1.3.10
            google: 5.41.0
            dirs: .
          - name: terraform-latest
            cli: terraform
            version: latest
            dirs: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: matrix.cli == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.version }}
          tofu_wrapper: false

      - if: matrix.cli == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.version }}
          terraform_wrapper: false

      # Pins the provider to the minimum version; *_override.tf is git-ignored.
      - name: Pin google provider to ${{ matrix.google }}
        if: matrix.google
        run: |
          cat > ci_override.tf <<HCL
          terraform {
            required_providers {
              google = {
                source  = "hashicorp/google"
                version = "= ${{ matrix.google }}"
              }
            }
          }
          HCL

      - name: Validate
        env:
          CLI: ${{ matrix.cli }}
          DIRS: ${{ matrix.dirs }}
        run: |
          for dir in $DIRS; do
            echo "::group::$CLI validate $dir"
            "$CLI" -chdir="$dir" init -backend=false -input=false
            "$CLI" -chdir="$dir" validate
            echo "::endgroup::"
          done

  # All severities as a report in the Security tab; does not fail the build.
  trivy-sarif:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: .
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          trivyignores: .trivyignore
          format: sarif
          output: trivy.sarif
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-config
